[project]
name = "medibot"
version = "0.1.0"
description = "A project-first learning implementation of the MediBot assignment"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "qdrant-client>=1.15,<2",
    "sentence-transformers>=5,<7",
    "torch>=2.8,<3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }
